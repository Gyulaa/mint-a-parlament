# A 2. melléklet kézzel megfogalmazott tételei (oevk/melleklet.py), kulcs: "<körzet>|<kerület>".
# A hatályos melléklet budapesti stílusában: zárt határvonal utcatengelyek mentén; a kiegészítő körzet
# ugyanazt a vonalat ellentétes körüljárással kapja. Ahol a szavazókör határa a lakótelepen nem utcán,
# hanem a házak mögött fut, ott egy záró mondat sorolja fel a vonal túloldalára eső házszámokat (a hatályos
# melléklet Pécsnél és Debrecennél ugyanígy jelöli a házszámokat: „mindkét oldala”, „házszámok nélkül”).
# Ellenőrzés: a vonalat az OSM utcatengelyeiből felépítve minden OSM-címet összevetettem az NVI
# szavazóköri címjegyzéke szerinti körzettel (X. ker. 3000 cím, XX. ker. 5955 cím). A XX. kerületben nincs
# eltérés. A X. kerületben 2 van, mindkettő a változatlan, hatályos 07-es határvonalon (Robert Bosch u. 4.,
# Sibrik Miklós út 23.), tehát nem ettől a leírástól függ. (Gyula, 2026-10-10)

"01-08|X. kerület": >-
  A X. kerület választókerülethez tartozó részének határvonala: A X. kerület határvonalának és a Sibrik
  Miklós út tengelyvonalainak a Sibrik Miklós úti felüljárónál elhelyezkedő metszéspontjától a Sibrik Miklós
  út tengelyvonala a Mádi utcáig, a Mádi utca tengelyvonala a Tavas utcáig, a Tavas utca tengelyvonala a
  Harmat utcáig, a Harmat utca tengelyvonala a Hangár utcáig, a Hangár utca tengelyvonala keleti irányban a X.
  kerület határvonaláig, a metszésponttól a X. kerület határvonala az óramutató járásával megegyező irányban
  a kiindulási pontig. A választókerülethez tartozik továbbá a Harmat utca páros oldala a 158. számtól a
  Sibrik Miklós útig és a Mádi utca 198–200. száma; nem tartozik hozzá a Mádi utca 175. és 177. száma.

